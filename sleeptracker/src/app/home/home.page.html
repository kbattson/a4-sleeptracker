<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Log Today
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <app-log-card title="Bedtime" (logged)="onBedtime($event)"></app-log-card>
  <app-log-card title="Wake Up" (logged)="onWakeup($event)"></app-log-card>
  <app-sleepiness-card (logged)="onSleepiness($event)"></app-sleepiness-card>
</ion-content>
